plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "org.jetbrains.kotlin.jvm" version "1.7.20"
    id "org.jetbrains.kotlin.kapt" version "1.7.20"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.chattags.plugin"
version "1.1.3"

repositories {
    mavenCentral()

    maven {
        url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }

    maven {
        url "${artifactory_contextUrl}/gradle-release"
        credentials {
            username "${artifactory_user}"
            password "${artifactory_password}"
        }
    }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib"

    compileOnly "gg.scala.lemon:bukkit:1.5.0"
    compileOnly "gg.scala.spigot:server:1.1.0"
    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.scala.cloudsync:spigot:1.0.1"

    compileOnly "net.kyori:adventure-text-minimessage:4.11.0"

    compileOnly "gg.scala.commons:bukkit:3.0.6"
    kapt "gg.scala.commons:bukkit:3.0.6"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "17"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "chattags-plugin.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "${artifactory_contextUrl}/${artifactory_release}"
            credentials {
                username "${artifactory_user}"
                password "${artifactory_password}"
            }
        }
    }
}

artifactory {
    this.contextUrl = "${artifactory_contextUrl}"

    publish {
        repository {
            repoKey = "${artifactory_release_local}"
            username = "${artifactory_user}"
            password = "${artifactory_password}"
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
